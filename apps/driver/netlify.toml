# Netlify site: driver (delivery portal)
#
# Netlify UI:
#   Base directory: (empty = repository root)
#   Config file: apps/driver/netlify.toml
#
# Paths below are relative to the repository root.

[build]
command = "npm run build:driver"
publish = "apps/driver/dist"

[build.environment]
NODE_VERSION = "22"

[dev]
command = "npm run dev"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
