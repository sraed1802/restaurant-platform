# supabase/config.toml
# Supabase project configuration

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5174",
  "https://order.restaurant.qa",
  "https://ops.restaurant.qa"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Passwordless email: local Auth ignores Dashboard templates. Restart after edits:
#   supabase stop && supabase start
# Hosted projects: still configure Magic Link in Dashboard (same HTML).
[auth.email.template.magic_link]
subject = "Your sign-in code"
# Resolved from repo root (where you run `supabase start`), not from this file’s folder.
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
# Enable phone/OTP auth — configure your SMS provider in the dashboard
enable_signup = true

# Set enabled = true and supply SUPABASE_AUTH_SMS_TWILIO_* env vars when testing SMS locally.
[auth.sms.twilio]
enabled = false
account_sid = "env(SUPABASE_AUTH_SMS_TWILIO_ACCOUNT_SID)"
message_service_sid = "env(SUPABASE_AUTH_SMS_TWILIO_MSG_SERVICE_SID)"
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[edge_runtime]
policy = "oneshot"

[analytics]
enabled = false
