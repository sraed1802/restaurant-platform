# netlify/netlify.admin.toml
# Reference copy — deploy using apps/admin/netlify.toml (set Netlify base directory to apps/admin)

[build]
  command = "npm run build:admin"
  publish = "apps/admin/dist"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
