# netlify/netlify.driver.toml
# Reference copy — deploy using apps/driver/netlify.toml (set Netlify base directory to apps/driver)

[build]
  command = "npm run build:driver"
  publish = "apps/driver/dist"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
